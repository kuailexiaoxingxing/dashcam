name: pages-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest app
        run: |
          mkdir -p site
          URL=$(tr -d ' \r\n' < app-url.txt)
          echo "pointer=$URL"
          curl -fL --retry 3 --retry-delay 2 -A 'Mozilla/5.0' "$URL" -o site/index.html
          test -s site/index.html
          wc -c site/index.html
          grep -q 'DashCamNative' site/index.html || true

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: dep
        uses: actions/deploy-pages@v4
